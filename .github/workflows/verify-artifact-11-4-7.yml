name: Verify encrypted 11.4.7 artifact
on:
  push:
    branches:
      - codex/secure-artifact-transfer-12f95cc
permissions:
  actions: read
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: personal-lite-encrypted
          run-id: 45107765554
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source
      - name: Decrypt and verify APK
        env:
          ARTIFACT_PASSWORD: ${{ secrets.ARTIFACT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_PASSWORD"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:ARTIFACT_PASSWORD -in "$RUNNER_TEMP/source/personal-lite.zip.enc" -out "$RUNNER_TEMP/personal-lite.zip"
          unzip -q "$RUNNER_TEMP/personal-lite.zip" -d "$RUNNER_TEMP/apks"
          apk="$RUNNER_TEMP/apks/Cherrygram-11.4.7-TG-13.1.1-arm64-v8a.apk"
          echo 'f0ae58dd37950e5fbb742ff053f505384447d907fd7f47df625ddf84dec3851f  '"$apk" | sha256sum -c -
          tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$tools_dir/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/signature.txt"
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/signature.txt"
          grep -iF '3f15d155583211a80c290628c5490093edb4ece3677ef25fdfcad6e59b086e01' "$RUNNER_TEMP/signature.txt"
          "$tools_dir/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='uz.unnarsx.cherrygram' versionCode='72460' versionName='11.4.7'" "$RUNNER_TEMP/badging.txt"
          grep -F "native-code: 'arm64-v8a'" "$RUNNER_TEMP/badging.txt"
