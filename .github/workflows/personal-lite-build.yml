name: Personal Lite APK build
on:
  push:
    branches: [codex/personal-lite-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Apply personal changes
        run: git apply --check personal-lite.patch && git apply personal-lite.patch
      - name: Check required build inputs
        run: |
          test -f TMessagesProj/src/main/java/uz/unnarsx/cherrygram/Extra.kt || { echo "::error::Extra.kt is missing from upstream and must be provided before compilation"; exit 1; }
          test -f TMessagesProj/google-services.json || { echo "::error::google-services.json is missing"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Generate temporary CI signing key
        run: keytool -genkeypair -keystore Your_Key.jks -alias Your_Alias -storepass Your_Password -keypass Your_Password -dname "CN=Personal Lite CI" -keyalg RSA -keysize 2048 -validity 3650
      - name: Build standalone APK
        run: gradle :TMessagesProj_AppStandalone:assembleAfatStandalone --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: personal-lite-apk
          path: TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
