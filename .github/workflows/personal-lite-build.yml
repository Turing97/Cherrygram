name: Personal Lite APK build
on:
  push:
    branches: [codex/personal-lite-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false
      - name: Apply personal changes
        run: git apply --check personal-lite.patch && git apply personal-lite.patch
      - name: Configure Telegram credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          app_id, app_hash = os.getenv('TELEGRAM_API_ID', ''), os.getenv('TELEGRAM_API_HASH', '')
          if bool(app_id) != bool(app_hash):
              raise SystemExit('Configure both TELEGRAM_API_ID and TELEGRAM_API_HASH')
          if app_id:
              if (not re.fullmatch(r'[1-9][0-9]{0,9}', app_id)
                      or int(app_id) > 2147483647
                      or not re.fullmatch(r'[0-9a-fA-F]{32}', app_hash)):
                  raise SystemExit('Invalid Telegram API credentials format')
              p = Path('TMessagesProj/src/main/java/uz/unnarsx/cherrygram/Extra.kt')
              s = p.read_text(encoding='utf-8')
              if s.count('return 12345678') != 1 or s.count('return "abcdefg"') != 1:
                  raise SystemExit('Telegram credential placeholders have changed')
              s = s.replace('return 12345678', 'return ' + app_id).replace('return "abcdefg"', 'return "' + app_hash + '"')
              p.write_text(s, encoding='utf-8')
          else:
              print('No Telegram credentials provided; this is a compilation-only build.')
          PY
      - name: Check required build inputs
        run: |
          test -f TMessagesProj/src/main/java/uz/unnarsx/cherrygram/Extra.kt || { echo "::error::Extra.kt is missing from upstream and must be provided before compilation"; exit 1; }
          test -f TMessagesProj/google-services.json || { echo "::error::google-services.json is missing"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          validate-wrappers: false
          cache-disabled: ${{ env.TELEGRAM_API_ID != '' }}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Prepare signing key
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            test -n "$SIGNING_STORE_PASSWORD" && test -n "$SIGNING_KEY_ALIAS" && test -n "$SIGNING_KEY_PASSWORD" || { echo "All signing secrets are required"; exit 1; }
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > Your_Key.jks
          else
            if [ -n "$TELEGRAM_API_ID" ]; then echo "A persistent signing key is required for a usable build"; exit 1; fi
            keytool -genkeypair -storetype PKCS12 -keystore Your_Key.jks -alias Your_Alias -storepass Your_Password -keypass Your_Password -dname "CN=Personal Lite CI" -keyalg RSA -keysize 2048 -validity 3650
          fi
      - name: Compile Java and Kotlin before native build
        run: gradle :TMessagesProj:compileStandaloneJavaWithJavac --stacktrace
      - name: Build standalone APK
        run: gradle :TMessagesProj_AppStandalone:assembleAfatStandalone --stacktrace
      - name: Encrypt APKs containing personal Telegram credentials
        if: ${{ env.TELEGRAM_API_ID != '' }}
        shell: bash
        run: |
          shopt -s globstar nullglob
          apks=(TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "::error::No APK was produced"
            exit 1
          fi
          zip -j -q "$RUNNER_TEMP/personal-lite.zip" "${apks[@]}"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 \
            -pass env:SIGNING_STORE_PASSWORD -in "$RUNNER_TEMP/personal-lite.zip" \
            -out "$RUNNER_TEMP/personal-lite.zip.enc"
          rm "$RUNNER_TEMP/personal-lite.zip"
      - uses: actions/upload-artifact@v4
        if: ${{ env.TELEGRAM_API_ID != '' }}
        with:
          name: personal-lite-encrypted
          path: ${{ runner.temp }}/personal-lite.zip.enc
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ env.TELEGRAM_API_ID == '' }}
        with:
          name: personal-lite-apk
          path: TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
          if-no-files-found: error
